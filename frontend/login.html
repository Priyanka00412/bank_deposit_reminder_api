<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Bank Deposit Manager</title>
    
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="container">

        <h1>
            🏦 Bank Deposit Manager
        </h1>

        <p>
            Login to manage your bank deposits.
        </p>


        <h2>
            Login
        </h2>


        <form id="loginForm">

            <label>
                Username
            </label>

            <input
                type="text"
                id="username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p id="message"></p>

    </div>


    <script>

        // ========================================
        // LOGIN FORM
        // ========================================

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const message =
            document.getElementById(
                "message"
            );


        // ========================================
        // LOGIN
        // ========================================

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const username =
                    document.getElementById(
                        "username"
                    ).value;


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                // ========================================
                // CREATE FORM DATA
                // ========================================

                const formData =
                    new URLSearchParams();


                formData.append(
                    "username",
                    username
                );


                formData.append(
                    "password",
                    password
                );


                // ========================================
                // SEND LOGIN REQUEST
                // ========================================

                try {

                    const response =
                        await fetch(
                            "http://localhost:8001/auth/login",
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/x-www-form-urlencoded"

                                },

                                body: formData

                            }
                        );


                    const result =
                        await response.json();


                    console.log(
                        "LOGIN RESPONSE:",
                        result
                    );


                    // ========================================
                    // LOGIN SUCCESS
                    // ========================================

                    if (response.ok) {

                        localStorage.setItem(
                            "access_token",
                            result.access_token
                        );


                        message.textContent =
                            "Login successful!";


                        window.location.href =
                            "dashboard.html";


                    }


                    // ========================================
                    // LOGIN FAILED
                    // ========================================

                    else {

                        message.textContent =
                            result.detail ||
                            "Login failed.";

                    }


                }


                // ========================================
                // CONNECTION ERROR
                // ========================================

                catch (error) {

                    console.error(
                        "LOGIN ERROR:",
                        error
                    );


                    message.textContent =
                        "Could not connect to the API.";

                }

            }
        );

    </script>

</body>

</html>
