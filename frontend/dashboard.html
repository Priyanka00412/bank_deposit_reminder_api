<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bank Deposit Manager</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="table-container">

        <h1>🏦 Bank Deposit Manager</h1>

<button
    type="button"
    id="logoutButton"
>
    Logout
</button>

        <p>
            Manage your bank deposits and maturity reminders.
        </p>


        <!-- ========================= -->
        <!-- ADD DEPOSIT -->
        <!-- ========================= -->

        <h2>Add Deposit</h2>

        <form id="depositForm">

            <label>Bank</label>

            <input
                type="text"
                id="bank"
                required
            >


            <label>Certificate Number</label>

            <input
                type="text"
                id="certificate_no"
                required
            >


            <label>Amount</label>

            <input
                type="number"
                id="amount"
                required
            >


            <label>Interest Rate (%)</label>

            <input
                type="number"
                step="0.01"
                id="interest_rate"
                required
            >


            <label>Maturity Date</label>

            <input
                type="date"
                id="maturity_date"
                required
            >


            <label>Maturity Amount</label>

            <input
                type="number"
                step="0.01"
                id="maturity_amount"
                required
            >


            <label>Email</label>

            <input
                type="email"
                id="email"
                required
            >


            <button type="submit">
                Add Deposit
            </button>

        </form>


        <!-- MESSAGE -->

        <p id="message"></p>


        <!-- ========================= -->
        <!-- EDIT DEPOSIT -->
        <!-- ========================= -->

        <div
            id="editFormContainer"
            style="display: none;"
        >

            <h2>Edit Deposit</h2>


            <form id="editForm">

                <label>Certificate Number</label>

                <input
                    type="text"
                    id="editCertificateNo"
                    readonly
                >


                <label>Bank</label>

                <input
                    type="text"
                    id="editBank"
                    required
                >


                <label>Amount</label>

                <input
                    type="number"
                    id="editAmount"
                    required
                >


                <label>Interest Rate (%)</label>

                <input
                    type="number"
                    step="0.01"
                    id="editInterestRate"
                    required
                >


                <label>Maturity Date</label>

                <input
                    type="date"
                    id="editMaturityDate"
                    required
                >


                <label>Maturity Amount</label>

                <input
                    type="number"
                    step="0.01"
                    id="editMaturityAmount"
                    required
                >


                <label>Email</label>

                <input
                    type="email"
                    id="editEmail"
                    required
                >


                <button type="submit">
                    Save Changes
                </button>


                <button
                    type="button"
                    id="cancelEdit"
                >
                    Cancel
                </button>

            </form>

        </div>


        <!-- ========================= -->
        <!-- DEPOSITS -->
        <!-- ========================= -->

        <h2>Your Deposits</h2>


        <!-- SEARCH -->

        <div class="search-container">

            <input
                type="text"
                id="searchInput"
                placeholder="Search by bank or certificate number"
            >

        </div>


        <!-- ========================= -->
        <!-- ACTION AREA -->
        <!-- ========================= -->

        <div class="action-container">

            <p>
                Selected deposit:
                <strong id="selectedDeposit">
                    None
                </strong>
            </p>


            <button
                type="button"
                id="editButton"
                disabled
            >
                Edit
            </button>


            <button
                type="button"
                id="reminderButton"
                disabled
            >
                Send Reminder
            </button>


            <button
                type="button"
                id="collectedButton"
                disabled
            >
                Mark Collected
            </button>


            <button
                type="button"
                id="deleteButton"
                disabled
            >
                Delete
            </button>

        </div>


        <!-- ========================= -->
        <!-- DEPOSIT TABLE -->
        <!-- ========================= -->

        <table id="depositTable">

            <thead>

                <tr>

                    <th>Select</th>

                    <th>Bank</th>

                    <th>Certificate</th>

                    <th>Amount</th>

                    <th>Interest</th>

                    <th>Maturity Date</th>

                    <th>Days Remaining</th>

                    <th>Maturity Amount</th>

                    <th>Status</th>

                    <th>Reminders</th>

                    <th>Email</th>

                </tr>

            </thead>


            <tbody id="depositTableBody">

            </tbody>

        </table>

    </div>


    <script src="script.js"></script>

</body>

</html>
